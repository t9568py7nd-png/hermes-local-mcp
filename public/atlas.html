<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes — Repo Atlas</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111821; --panel-2:#0e141c; --line:#1e2a36;
    --text:#e6edf5; --dim:#8b9bad; --accent:#f0b429; --accent-2:#39d3a4;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;color:var(--text);
    background:
      radial-gradient(900px 500px at 8% -10%, #17303a 0%, transparent 60%),
      radial-gradient(700px 420px at 100% 0%, #2a2011 0%, transparent 55%),
      var(--bg);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);position:sticky;top:0;z-index:5;
    backdrop-filter:blur(8px)}
  .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(145deg,#f0b429,#c8860d);color:#1b1200;font-weight:800;letter-spacing:-1px;
    box-shadow:0 6px 18px rgba(240,180,41,.28)}
  h1{font-size:15px;letter-spacing:.22em;margin:0;font-weight:700;text-transform:uppercase}
  h1 span{color:var(--dim);font-weight:500;letter-spacing:.08em;text-transform:none;font-size:12px;margin-left:10px}
  .links{margin-left:auto;display:flex;gap:10px;align-items:center;font:12px/1 var(--mono)}
  .links a{color:var(--dim);text-decoration:none;padding:7px 11px;border:1px solid var(--line);border-radius:999px}
  .links a:hover{color:var(--text);border-color:#2b3a4a}
  main{padding:22px 26px 60px;max-width:1220px;margin:0 auto}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  input[type=search]{flex:1;min-width:240px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font:13px/1.4 var(--mono)}
  input[type=search]:focus{outline:none;border-color:#33506a;box-shadow:0 0 0 3px rgba(51,80,106,.25)}
  button{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
    color:var(--text);font:12px/1 var(--mono);cursor:pointer}
  button:hover{border-color:#2b3a4a}
  button.primary{background:linear-gradient(180deg,#f0b429,#d99b12);color:#1b1200;border-color:#c8860d;font-weight:700}
  button:disabled{opacity:.55;cursor:default}
  .stats{display:flex;gap:18px;flex-wrap:wrap;font:12px/1 var(--mono);color:var(--dim);margin-bottom:18px}
  .stats b{color:var(--text);font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;cursor:pointer;
    transition:border-color .12s, transform .12s}
  .card:hover{border-color:#33506a;transform:translateY(-1px)}
  .card h3{margin:0 0 4px;font:600 15px/1.3 var(--mono);display:flex;align-items:center;gap:8px}
  .branch{font:10px/1 var(--mono);color:var(--accent-2);border:1px solid rgba(57,211,164,.3);
    background:rgba(57,211,164,.08);padding:4px 6px;border-radius:5px}
  .sub{color:var(--dim);font:11px/1.5 var(--mono);margin-bottom:10px;word-break:break-all}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font:10px/1 var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
  .chip em{color:var(--text);font-style:normal}
  .symbols{font:11px/1.7 var(--mono);color:var(--dim);max-height:74px;overflow:hidden}
  .symbols span{color:var(--accent)}
  .hits{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);margin-bottom:18px;overflow:hidden}
  .hit{display:flex;gap:12px;padding:9px 13px;border-top:1px solid var(--line);font:12px/1.5 var(--mono)}
  .hit:first-child{border-top:0}
  .hit .repo{color:var(--accent);min-width:170px}
  .hit .kind{color:var(--dim);min-width:110px}
  .hit .where{color:#6f8ba6}
  .empty{color:var(--dim);font:12px/1.7 var(--mono);padding:14px}
  dialog{border:1px solid var(--line);border-radius:14px;background:#0d141d;color:var(--text);max-width:820px;width:92%;
    padding:0;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  dialog::backdrop{background:rgba(4,7,10,.72)}
  .dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .dlg-head h2{margin:0;font:600 16px/1.2 var(--mono)}
  .dlg-head button{margin-left:auto}
  .dlg-body{padding:14px 18px;max-height:66vh;overflow:auto;font:12px/1.6 var(--mono);color:var(--dim)}
  .dlg-body h4{margin:14px 0 6px;font:11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .dlg-body code{color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="mark">H</div>
  <h1>Hermes <span>repo atlas</span></h1>
  <div class="links">
    <a href="/">console</a>
    <a href="/api/atlas" target="_blank">raw json</a>
  </div>
</header>

<main>
  <div class="bar">
    <input type="search" id="q" placeholder="Search symbols, READMEs, headings, entrypoints…" autocomplete="off" />
    <button id="scan">Rescan repos</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="hits" id="hits" hidden></div>
  <div class="cards" id="cards"></div>
</main>

<dialog id="detail">
  <div class="dlg-head"><h2 id="detailTitle"></h2><button id="closeDetail">close</button></div>
  <div class="dlg-body" id="detailBody"></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => (n || 0).toLocaleString();
let ATLAS = null;

function apiFetch(url, opts = {}) {
  const token = localStorage.getItem('hermes-token') || '';
  const headers = { ...(opts.headers || {}) };
  if (token) headers.authorization = `Bearer ${token}`;
  return fetch(url, { ...opts, headers });
}

function chipsFor(repo) {
  const out = [];
  out.push(`<span class="chip"><em>${fmt(repo.files)}</em> files</span>`);
  out.push(`<span class="chip"><em>${fmt(repo.loc)}</em> loc</span>`);
  out.push(`<span class="chip"><em>${fmt(repo.symbols?.length || 0)}</em> symbols</span>`);
  for (const lang of (repo.languages || []).slice(0, 3)) {
    out.push(`<span class="chip">${lang.ext} <em>${fmt(lang.loc)}</em></span>`);
  }
  return out.join('');
}

function cardFor(repo) {
  const el = document.createElement('article');
  el.className = 'card';
  const symbols = (repo.symbols || []).slice(0, 6)
    .map((s) => `<div>${s.kind}\t<span>${s.name}</span>\t${s.file}:${s.line}</div>`).join('');
  el.innerHTML = `
    <h3>${repo.name} <span class="branch">${repo.git?.branch || 'no git'}</span></h3>
    <div class="sub">${repo.git ? `${repo.git.commit} · ${repo.git.date} · ${repo.git.subject}` : 'not a git checkout'}</div>
    <div class="chips">${chipsFor(repo)}</div>
    <div class="symbols">${symbols || '<div>no symbols found</div>'}</div>`;
  el.addEventListener('click', () => showDetail(repo.name));
  return el;
}

function render() {
  if (!ATLAS) return;
  $('stats').innerHTML = `<span><b>${ATLAS.totals.repos}</b> repos</span>
    <span><b>${fmt(ATLAS.totals.files)}</b> files</span>
    <span><b>${fmt(ATLAS.totals.loc)}</b> lines</span>
    <span><b>${fmt(ATLAS.totals.symbols)}</b> symbols</span>
    <span>scanned ${new Date(ATLAS.generatedAt).toLocaleString()} in ${ATLAS.durationMs} ms</span>
    <span>${ATLAS.reposDir}</span>`;
  const cards = $('cards');
  cards.replaceChildren(...ATLAS.repos.map(cardFor));
}

async function load() {
  const res = await apiFetch('/api/atlas');
  if (res.status === 404) {
    $('stats').innerHTML = '<span>no atlas yet — press “Rescan repos”</span>';
    return;
  }
  ATLAS = await res.json();
  render();
}

async function rescan() {
  const btn = $('scan');
  btn.disabled = true;
  btn.textContent = 'Scanning…';
  try {
    const res = await apiFetch('/api/atlas/scan', { method: 'POST' });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'scan failed');
    await load();
    btn.textContent = `Scanned in ${body.durationMs} ms`;
  } catch (err) {
    $('stats').innerHTML = `<span>scan failed: ${err.message}</span>`;
    btn.textContent = 'Rescan repos';
  } finally {
    btn.disabled = false;
    setTimeout(() => { btn.textContent = 'Rescan repos'; }, 2500);
  }
}

function renderHits(hits, query) {
  const box = $('hits');
  if (!query) { box.hidden = true; box.replaceChildren(); return; }
  box.hidden = false;
  if (!hits.length) {
    box.replaceChildren(Object.assign(document.createElement('div'),
      { className: 'empty', textContent: `no hits for "${query}"` }));
    return;
  }
  box.replaceChildren(...hits.map((h) => {
    const row = document.createElement('div');
    row.className = 'hit';
    row.innerHTML = `<span class="repo">${h.repo}</span><span class="kind">${h.kind}</span>
      <span>${h.text}</span><span class="where">${h.where}</span>`;
    return row;
  }));
}

let searchTimer = null;
$('q').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const query = e.target.value.trim();
  searchTimer = setTimeout(async () => {
    if (!query) return renderHits([], '');
    const res = await apiFetch(`/api/atlas/search?q=${encodeURIComponent(query)}&limit=40`);
    const body = await res.json();
    renderHits(body.hits || [], query);
  }, 140);
});

async function showDetail(name) {
  const res = await apiFetch(`/api/atlas/${encodeURIComponent(name)}`);
  const repo = await res.json();
  $('detailTitle').textContent = repo.name || name;
  const langs = (repo.languages || []).map((l) => `<div>${l.ext} — ${fmt(l.files)} files, ${fmt(l.loc)} loc</div>`).join('');
  const eps = (repo.entrypoints || []).map((e) => `<code>${e}</code>`).join(', ') || 'none detected';
  const syms = (repo.symbols || []).slice(0, 120)
    .map((s) => `<div>${s.kind}\t${s.name} — ${s.file}:${s.line}</div>`).join('');
  const manifest = repo.manifest
    ? `<h4>manifest</h4><div>${repo.manifest.file}${repo.manifest.dependencies ? ` · ${repo.manifest.dependencies.length} deps` : ''}</div>
       <div>${(repo.manifest.dependencies || []).slice(0, 40).join(', ')}</div>`
    : '';
  $('detailBody').innerHTML = `
    <h4>location</h4><div><code>${repo.path}</code></div>
    <h4>git</h4><div>${repo.git ? `${repo.git.branch} @ ${repo.git.commit} · ${repo.git.date} · ${repo.git.subject}` : 'not a git checkout'}</div>
    <h4>size</h4><div>${fmt(repo.files)} files · ${fmt(repo.loc)} lines${repo.truncated ? ' · truncated at scan limit' : ''}</div>
    <h4>languages</h4>${langs || '<div>none</div>'}
    <h4>entrypoints</h4><div>${eps}</div>
    ${manifest}
    <h4>readme</h4><div>${repo.readme || 'no README'}</div>
    <h4>symbols (${(repo.symbols || []).length})</h4>${syms || '<div>none</div>'}`;
  $('detail').showModal();
}

$('closeDetail').addEventListener('click', () => $('detail').close());
$('scan').addEventListener('click', rescan);
load();
</script>
</body>
</html>
