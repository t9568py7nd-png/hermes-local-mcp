name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke test
        run: |
          node src/cli.js mcp-json | grep -q '"hermes"'
          node src/cli.js start
          node src/cli.js status
          curl -fsS http://127.0.0.1:4123/api/health
          node src/cli.js stop
